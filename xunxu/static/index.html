<!doctype html><html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>循序 · 研究生长空间</title><link rel="stylesheet" href="/style.css"></head><body><aside class="sidebar"><div class="brand"><span class="brand-icon">✳</span><div>循序<small>XUNXU / RESEARCH</small></div></div><button class="new-space" id="newSpace">＋ 新建研究空间</button><div class="label">我的研究森林</div><div id="spaces"></div><div class="side-bottom"><p>让每一个想法<br>都有生长的地方。</p><button id="settings">⚙ 模型与连接</button><small>本地研究空间 · V1.1</small></div></aside><main><header><div><div class="eyebrow">自生长研究路径图</div><h1 id="spaceTitle">研究空间</h1></div><div class="header-actions"><input id="search" placeholder="搜索思想、节点与证据…"><button id="refresh">↻</button><button class="primary" id="addNode">＋ 研究节点</button></div></header><div id="error" hidden></div><section class="workspace"><div class="tree-panel"><div class="tree-heading"><span class="live-dot"></span>研究生长图 <small>祖先路径继承 · 重要结构调整由你确认</small></div><div id="tree" tabindex="0"></div><div class="tree-tools"><button id="zoomOut">−</button><span id="zoomValue">100%</span><button id="zoomIn">＋</button><button id="fit">适应画布</button></div><div class="legend"><i></i>思想 <i class="action"></i>行动 <span>◌ 启发式候选方向</span></div></div><aside class="archive"><div class="archive-top"><div class="eyebrow" id="nodeKind">节点档案</div><h2 id="nodeTitle">选择一个节点</h2><div id="nodeMeta"></div><div class="node-actions"><button id="nodeMenu">结构操作 ▾</button><button class="primary" id="ask">＋ 记录问答</button></div></div><nav id="tabs"><button data-tab="summary" class="active">概览</button><button data-tab="qa">问答</button><button data-tab="runs">实验</button><button data-tab="resources">资源</button><button data-tab="history">历史</button></nav><div id="archiveContent"></div></aside></section><footer><span id="metrics">正在读取研究空间…</span><span>思想发现关系，证据保留真实，研究沿路径生长。</span></footer></main><div id="contextMenu" hidden></div><dialog id="modal"><form id="dialogForm"><div class="dialog-heading"><h2 id="dialogTitle"></h2><button type="button" id="closeDialog">×</button></div><div id="dialogBody"></div><div id="dialogError" hidden></div><div class="dialog-footer"><button type="button" id="cancelDialog">取消</button><button class="primary" type="submit">确认</button></div></form></dialog><div id="toast" hidden></div><script src="/app.js"></script></body></html>
