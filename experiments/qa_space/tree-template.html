<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>循序 · 智能制造单根研究树</title>
<style>
:root{color-scheme:light dark;--bg:light-dark(#f7f9fc,#111821);--panel:light-dark(#fff,#1a2533);--text:light-dark(#203044,#e5edf7);--muted:light-dark(#62758a,#a2b2c7);--line:light-dark(#c9d5e2,#405267);--accent:light-dark(#1669c6,#68acff);--node:light-dark(#edf5fd,#213a52);--source:light-dark(#fff4e3,#48371f);--selected:light-dark(#d8ecff,#244f78)}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font:14px/1.6 system-ui,-apple-system,sans-serif}header{padding:18px 24px;background:var(--panel);border-bottom:1px solid var(--line)}h1{font-size:21px;margin:0;font-weight:650}.meta{color:var(--muted);font-size:13px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;padding:12px 24px;background:var(--panel);border-bottom:1px solid var(--line)}button,select,input{font:inherit;color:var(--text);background:var(--panel);border:1px solid var(--line);border-radius:7px;padding:7px 10px}button{cursor:pointer}button:hover{background:var(--selected)}input{width:230px;max-width:100%}select{max-width:320px;min-width:0}.toolbar label{display:flex;align-items:center;gap:6px;max-width:100%}.main{display:grid;grid-template-columns:minmax(0,1fr) 360px;height:calc(100dvh - 157px);min-height:470px}.canvas{position:relative;overflow:hidden;background:var(--bg);touch-action:none}.canvas svg{width:100%;height:100%;display:block;cursor:grab}.canvas svg.dragging{cursor:grabbing}.tree-link{fill:none;stroke:var(--line);stroke-width:2}.source-link{fill:none;stroke:#bd8c42;stroke-width:2;stroke-dasharray:7 5}.group-title{fill:var(--muted);font-size:17px}.node{cursor:pointer}.node rect{fill:var(--node);stroke:var(--line);stroke-width:1.3}.node.external rect{fill:var(--source)}.node.selected rect{fill:var(--selected);stroke:var(--accent);stroke-width:3}.node text{fill:var(--text);font-size:13px;pointer-events:none}.node .id{font-size:14px;font-weight:650}.node:focus rect{stroke:var(--accent);stroke-width:3}.tree-link.focus-path{stroke:var(--accent);stroke-width:3}.hint{position:absolute;left:18px;bottom:14px;color:var(--muted);background:var(--panel);border:1px solid var(--line);padding:7px 10px;border-radius:6px;font-size:12px;pointer-events:none}.detail{background:var(--panel);border-left:1px solid var(--line);padding:20px;overflow:auto}.detail h2{font-size:18px;margin:0 0 12px}.detail p{margin:8px 0 16px}.tag{display:inline-block;padding:2px 7px;border:1px solid var(--line);border-radius:5px;margin:0 4px 7px 0;font-size:12px}.answer{white-space:pre-wrap;overflow-wrap:anywhere}.detail h3{font-size:14px;margin:22px 0 7px}.related button{margin:3px}.legend{display:flex;gap:16px;flex-wrap:wrap;margin-top:7px}.legend span::before{content:'';display:inline-block;width:24px;vertical-align:middle;margin-right:6px;border-top:2px solid var(--line)}.legend .dashed::before{border-top:2px dashed #bd8c42}.empty{color:var(--muted)}@media(max-width:760px){header,.toolbar{padding:12px}.main{grid-template-columns:1fr;height:auto}.canvas{height:65dvh;min-height:370px}.detail{border-left:0;border-top:1px solid var(--line);max-height:none}select{max-width:calc(100% - 40px)}.hint{max-width:90%}}
</style></head><body>
<header><h1>循序 · 智能制造单根研究树</h1><div class="meta">智能制造 · 唯一根节点 · 112 个已关联问答 · 2 个待复核 · 已排除13个外领域问题</div><div class="legend"><span>AI 推断父子关系 · 点击节点查看依据</span><span>实验结构，尚未独立验证</span></div></header>
<div class="toolbar"><label>节点 <select id="branch" aria-label="定位研究分支"></select></label><input id="search" placeholder="搜索编号或问题…" aria-label="搜索节点"><button id="find">定位</button><button id="out" aria-label="缩小">−</button><button id="in" aria-label="放大">＋</button><button id="fit">全图</button><button id="focus">定位当前节点</button><button id="expandLayer">展开一层</button><button id="expandAll">全部展开</button><button id="collapse">收起</button><button id="pending">待复核 2</button><span id="scale" class="meta"></span></div>
<div class="main"><div class="canvas"><svg id="graph" role="img" aria-label="原始问答父子关系图"><g id="viewport"><g id="edges"></g><g id="sources"></g><g id="nodes"></g></g></svg><div class="hint">滚轮缩放 · 拖动画布 · 点击节点看依据 · 节点 + 展开子问题</div></div><aside class="detail" id="detail" aria-live="polite"></aside></div>
<dialog id="pendingDialog" style="max-width:700px;width:90%;background:var(--panel);color:var(--text);border:1px solid var(--line);border-radius:10px"><h2>未强行关联的问答</h2><div id="pendingContent"></div><button id="closePending">关闭</button></dialog><script type="application/json" id="data">{}</script><script>(()=>{
 const data=JSON.parse(document.getElementById('data').textContent),nodes=data.nodes,byId=new Map(nodes.map(n=>[n.qa_id,n])),sources=new Map((data.source_records||[]).map(n=>[n.qa_id,n])),children=new Map();
 nodes.forEach(n=>{if(n.parent){if(!children.has(n.parent))children.set(n.parent,[]);children.get(n.parent).push(n)}});
 const root=nodes.find(n=>!n.parent),graph=document.getElementById('graph'),viewport=document.getElementById('viewport'),expanded=new Set([root.qa_id]);
 const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 if((children.get(root.qa_id)||[]).length===1){const first=children.get(root.qa_id)[0];if((children.get(first.qa_id)||[]).length<=10)expanded.add(first.qa_id)}
 let selected=root.qa_id,pos=new Map(),visible=[],zoom=1,tx=0,ty=0,drag=null,moved=false,totalWidth=800,totalHeight=500;
 function update(){viewport.setAttribute('transform','translate('+tx+','+ty+') scale('+zoom+')');document.getElementById('scale').textContent=Math.round(zoom*100)+'% · 显示 '+visible.length+'/'+nodes.length+' 节点'}
 function fitArea(b){const box=graph.getBoundingClientRect();zoom=Math.min((box.width-50)/b.width,(box.height-50)/b.height,1.4);tx=(box.width-b.width*zoom)/2-b.x*zoom;ty=(box.height-b.height*zoom)/2-b.y*zoom;update()}
 function fitAll(){fitArea({x:0,y:0,width:totalWidth,height:totalHeight})}
 function reveal(key){let n=byId.get(key);while(n.parent){expanded.add(n.parent);n=byId.get(n.parent)}}
 function focus(){reveal(selected);draw();const p=pos.get(selected);fitArea({x:Math.max(0,p.x-340),y:Math.max(0,p.y-340),width:750,height:600})}
 function draw(){
  visible=[];pos=new Map();let leaf=0;
  function place(n,depth){visible.push(n);const c=expanded.has(n.qa_id)?children.get(n.qa_id)||[]:[];let y;
   if(c.length){c.forEach(ch=>place(ch,depth+1));y=c.reduce((sum,ch)=>sum+pos.get(ch.qa_id).y,0)/c.length}else{y=115+leaf*195;leaf++}
   pos.set(n.qa_id,{x:130+depth*240,y,depth})
  }
  place(root,0);const maxDepth=Math.max(...visible.map(n=>pos.get(n.qa_id).depth));visible.forEach(n=>{const old=pos.get(n.qa_id);pos.set(n.qa_id,{x:old.y,y:95+(maxDepth-old.depth)*135,depth:old.depth})});totalWidth=Math.max(320,leaf*195+40);totalHeight=210+maxDepth*135;
  const paths=new Set();let n=byId.get(selected);while(n.parent){paths.add(n.qa_id);n=byId.get(n.parent)}
  document.getElementById('edges').innerHTML=visible.filter(n=>n.parent).map(n=>{const a=pos.get(n.parent),b=pos.get(n.qa_id);return '<path class="tree-link '+(paths.has(n.qa_id)?'focus-path':'')+'" d="M'+a.x+','+(a.y-35)+' C'+a.x+','+(a.y-85)+' '+b.x+','+(b.y+85)+' '+b.x+','+(b.y+35)+'"/>'}).join('');
  document.getElementById('sources').innerHTML='';
  document.getElementById('nodes').innerHTML=visible.map(n=>{const p=pos.get(n.qa_id),q=n.qa_id===root.qa_id?'唯一研究主题':n.question,kids=children.get(n.qa_id)||[];return '<g class="node '+(n.qa_id===selected?'selected':'')+'" data-key="'+n.qa_id+'" transform="translate('+p.x+','+p.y+')" tabindex="0" role="button" aria-label="'+esc(n.id+' '+q)+'"><title>'+esc(q)+'</title><rect x="-84" y="-35" width="168" height="70" rx="10"/><text class="id" text-anchor="middle" y="-13">'+esc(n.id)+'</text><text text-anchor="middle" y="7">'+esc(q.slice(0,11))+'</text><text text-anchor="middle" y="25">'+esc(q.slice(11,22))+(q.length>22?'…':'')+'</text>'+(kids.length?'<g data-expand="'+n.qa_id+'" role="button" tabindex="0" aria-label="'+(expanded.has(n.qa_id)?'收起':'展开')+esc(n.id)+'的'+kids.length+'个子问题"><circle cx="87" cy="0" r="14" fill="var(--panel)" stroke="var(--accent)"/><text x="87" y="5" text-anchor="middle" style="pointer-events:none">'+(expanded.has(n.qa_id)?'−':'+')+'</text></g>':'')+'</g>'}).join('');
  document.querySelectorAll('.node').forEach(e=>e.onkeydown=ev=>{if(ev.target.closest('[data-expand]'))return;if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();select(e.dataset.key)}});
  document.querySelectorAll('[data-expand]').forEach(e=>e.onkeydown=ev=>{if(ev.key==='Enter'||ev.key===' '){ev.preventDefault();toggle(e.dataset.expand)}});update()
 }
 function toggle(key){if(expanded.has(key))expanded.delete(key);else expanded.add(key);draw();fitAll()}
 function select(key,locate=false){selected=key;const n=byId.get(key),parent=byId.get(n.parent),extra=n.sources.filter(k=>byId.has(k)||sources.has(k)),kids=children.get(key)||[];
  document.getElementById('detail').innerHTML='<h2>'+esc(n.id===n.question?n.question:n.id+' · '+n.question)+'</h2><span class="tag">'+(n.sequence?'顺序 '+n.sequence:'唯一主题根')+'</span><span class="tag">'+esc(({root:'主题根',root_direction:'主题方向',specialization:'子问题展开',followup:'解释或追问'})[n.relation]||n.relation)+'</span><span class="tag">'+kids.length+' 个直接子问题</span>'+(kids.length?'<div><button id="toggleSelected">'+(expanded.has(key)?'收起':'展开')+'直接子问题</button></div>':'')+'<h3>核心内容</h3><p>'+esc(n.core)+'</p><h3>AI 选择的父问题</h3>'+(parent?'<div class="related"><button data-jump="'+parent.qa_id+'">'+esc(parent.id)+' · '+esc(parent.question)+'</button></div>':'<p>智能制造：用户指定的唯一根节点。</p>')+'<h3>连线依据</h3><p>'+esc(n.reason)+'</p><h3>引用片段</h3><p>'+esc(n.evidence)+'</p><p class="meta">引用位置：'+esc((n.evidence_locations||['用户指定主题']).map(x=>({'parent_question':'父问题原文','parent_core':'父问题核心描述','parent_answer':'父问题回答','current_question':'当前问题原文','current_core':'当前核心描述','current_answer':'当前回答'}[x]||x)).join('、'))+'。引用匹配不代表父子关系已被验证。</p>'+(extra.length?'<h3>保留的思想来源资料</h3>'+extra.map(k=>{const s=byId.get(k)||sources.get(k);return '<p><strong>'+esc(s.id)+'</strong> '+esc(s.question)+'</p>'}).join('')+'<p class="meta">来源资料不因此成为树节点或实证支持。</p>':'')+'<h3>完整原始回答</h3><div class="answer">'+esc(n.answer)+'</div>';
  document.querySelectorAll('[data-jump]').forEach(b=>b.onclick=()=>select(b.dataset.jump,true));document.getElementById('toggleSelected')?.addEventListener('click',()=>{toggle(key);select(key)});document.getElementById('branch').value=key;if(locate)focus();else draw()
 }
 const branch=document.getElementById('branch');branch.innerHTML=nodes.map(n=>'<option value="'+n.qa_id+'">'+esc(n.id===n.question?n.question:n.id+' · '+n.question.slice(0,24))+'</option>').join('');branch.onchange=()=>select(branch.value,true);
 function search(){const q=document.getElementById('search').value.trim().toLowerCase();if(!q)return;const n=nodes.find(n=>n.id.toLowerCase()===q)||nodes.find(n=>(n.question+' '+n.id).toLowerCase().includes(q));if(n)select(n.qa_id,true);else document.getElementById('scale').textContent='未在已关联树节点中找到'}
 document.getElementById('find').onclick=search;document.getElementById('search').onkeydown=e=>{if(e.key==='Enter')search()};
 function zoomAt(f,x,y){const next=Math.max(.06,Math.min(2.8,zoom*f));tx=x-(x-tx)*next/zoom;ty=y-(y-ty)*next/zoom;zoom=next;update()}
 graph.addEventListener('wheel',e=>{e.preventDefault();const b=graph.getBoundingClientRect();zoomAt(e.deltaY<0?1.12:1/1.12,e.clientX-b.left,e.clientY-b.top)},{passive:false});
 document.getElementById('in').onclick=()=>{const b=graph.getBoundingClientRect();zoomAt(1.2,b.width/2,b.height/2)};document.getElementById('out').onclick=()=>{const b=graph.getBoundingClientRect();zoomAt(1/1.2,b.width/2,b.height/2)};
 document.getElementById('fit').onclick=fitAll;document.getElementById('focus').onclick=focus;
 document.getElementById('expandAll').onclick=()=>{nodes.forEach(n=>expanded.add(n.qa_id));draw();fitAll()};document.getElementById('collapse').onclick=()=>{expanded.clear();expanded.add(root.qa_id);selected=root.qa_id;select(selected);fitAll()};
 document.getElementById('expandLayer').onclick=()=>{visible.forEach(n=>expanded.add(n.qa_id));draw();fitAll()};
 graph.onpointerdown=e=>{if(e.button!==0)return;drag={x:e.clientX,y:e.clientY,tx,ty,key:e.target.closest('.node')?.dataset.key,expand:e.target.closest('[data-expand]')?.dataset.expand};moved=false;graph.setPointerCapture(e.pointerId);graph.classList.add('dragging')};
 graph.onpointermove=e=>{if(drag){const dx=e.clientX-drag.x,dy=e.clientY-drag.y;if(Math.abs(dx)+Math.abs(dy)>5)moved=true;tx=drag.tx+dx;ty=drag.ty+dy;update()}};
 graph.onpointerup=e=>{const d=drag;drag=null;graph.classList.remove('dragging');if(graph.hasPointerCapture(e.pointerId))graph.releasePointerCapture(e.pointerId);if(d&&!moved){if(d.expand)toggle(d.expand);else if(d.key)select(d.key)}};
 
const pendingDialog=document.getElementById('pendingDialog');
document.getElementById('pendingContent').innerHTML=(data.pending_records||[]).map(r=>'<h3>'+r.id+' · '+r.question+'</h3><p>'+r.reason+'</p><p class="meta">校验未通过：引用片段未在关联两端逐字找到，暂不绘制连线。</p>').join('')||'<p>没有待复核记录。</p>';
document.getElementById('pending').onclick=()=>pendingDialog.showModal();document.getElementById('closePending').onclick=()=>pendingDialog.close();
new ResizeObserver(()=>{draw();fitAll()}).observe(graph);select(selected);fitAll();
})();
</script></body></html>
